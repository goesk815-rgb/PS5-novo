<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PlayStation 5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#07080c;overscroll-behavior:none;touch-action:manipulation}
body{font-family:"SST","Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;outline:none}
svg{display:block}

/* ---------- Tela (preenche tudo; o JS ajusta tamanho e rotação) ---------- */
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;transform-origin:0 0;background:#07080c}

/* ---------- Fundo ---------- */
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 75% 38% at 50% 108%,rgba(118,123,138,.36),transparent 70%),
  radial-gradient(ellipse 90% 70% at 50% 40%,#10121a 0%,#090a0f 70%,#06070a 100%)}
.beam{position:absolute;inset:0;pointer-events:none;transition:opacity .8s}
.beam .blurwrap{position:absolute;inset:0;filter:blur(26px)}
.beam .cone{position:absolute;inset:0;background:linear-gradient(180deg,rgba(236,216,204,.42) 0%,rgba(190,172,166,.16) 45%,transparent 88%);clip-path:polygon(15% -2%,32% -2%,66% 90%,-16% 90%)}
.beam .hot{position:absolute;inset:0;background:radial-gradient(ellipse 16% 22% at 24% 0%,rgba(255,244,236,.5),transparent 70%)}
#bokeh{position:absolute;left:0;top:0;pointer-events:none}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
.dim{position:absolute;inset:0;pointer-events:none;background:rgba(0,0,0,.38);opacity:0;transition:opacity .6s ease}
#app.s-add .dim{opacity:1}
#app.s-add .beam{opacity:.55}

/* ---------- Palco 1280x720 (escalado pelo JS) ---------- */
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
.layer{position:absolute;inset:0;will-change:opacity,transform,filter;
  transition:opacity .45s cubic-bezier(.4,0,.2,1),transform .6s cubic-bezier(.2,.8,.2,1),filter .45s ease;transition-delay:.15s}

#clock{position:absolute;right:53px;top:34px;font-size:21px;line-height:26px;font-weight:400;letter-spacing:.2px;transition:top .7s cubic-bezier(.2,.8,.2,1),right .7s cubic-bezier(.2,.8,.2,1),font-size .7s ease;z-index:3}
#app.s-home #clock{top:29px;right:49px;font-size:22px}

.title{position:absolute;left:0;right:0;top:96px;text-align:center;font-size:36px;line-height:52px;font-weight:300;letter-spacing:.2px;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.subtitle{position:absolute;left:0;right:0;top:161px;text-align:center;font-size:20px;line-height:26px;font-weight:300;color:rgba(255,255,255,.72)}

/* controle "1" */
.ctrl{position:absolute;left:641px;top:218px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;color:#a9a9b1}
.ctrl span{font-size:12px;line-height:14px;color:#cfcfd6}

/* Add User */
.add{position:absolute;left:316px;top:294px;width:180px;display:flex;flex-direction:column;align-items:center;touch-action:manipulation}
.add-circle{position:relative;width:140px;height:140px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 22%,rgba(255,255,255,.24),rgba(255,255,255,.12) 70%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);transition:background .25s}
.add-circle::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid rgba(255,255,255,.95);opacity:0;pointer-events:none}
.add-label{margin-top:46px;font-size:20px;line-height:26px;font-weight:300;color:rgba(255,255,255,.78)}
.add.pressing .add-circle{animation:addPress .5s cubic-bezier(.2,.8,.2,1) forwards;background:radial-gradient(circle at 50% 22%,rgba(255,255,255,.4),rgba(255,255,255,.24) 70%)}
.add.pressing .add-circle::after{animation:addRing .8s ease-out forwards}
.add:focus-visible .add-circle{box-shadow:0 0 0 3px rgba(255,255,255,.9)}
@keyframes addPress{0%{transform:scale(1)}35%{transform:scale(.92)}100%{transform:scale(1.05)}}
@keyframes addRing{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}

/* Usuário PS5 (sem nenhuma interação) */
.user{position:absolute;left:539px;top:269px;width:204px;display:flex;flex-direction:column;align-items:center;cursor:pointer;font:inherit;color:inherit;text-align:center;touch-action:manipulation}
.avatar{position:relative;width:204px;height:204px;transition:transform .16s ease-out}
.user.pressing .avatar{transform:scale(.94)}
.user:focus-visible .ring{box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.avatar .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 22px rgba(255,255,255,.14),4px 4px 14px rgba(255,110,150,.22)}
.avatar .disc{position:absolute;inset:11px;border-radius:50%;border:5px solid #f3f3f6;overflow:hidden;background:#0b0c11}
.uname{margin-top:8px;height:24px;display:flex;align-items:center;gap:6px;font-size:20px;line-height:24px;font-weight:400;color:rgba(255,255,255,.92)}
.opts{margin-top:9px;height:22px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}

/* Botão de energia */
.power{position:absolute;left:618px;top:651px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25)}

/* Dicas de botão */
.hints{position:absolute;right:22px;top:660px;height:48px;display:flex;align-items:center;gap:10px}
.hint{display:flex;align-items:center;gap:8px;height:48px;padding:0 8px;font-size:18px;font-weight:400;color:#fff}
.hint.static{cursor:default}

/* ---------- Tela Add User ---------- */
#add{opacity:0;transform:scale(1.05);filter:blur(10px);pointer-events:none;transition-delay:0s}
.stag{opacity:0;transform:translateY(14px);transition:opacity .45s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.pill{position:absolute;left:440px;width:400px;height:64px;border-radius:32px;font-size:22px;font-weight:400;background:rgba(255,255,255,.12);color:#fff}
.pill.focus{background:rgba(255,255,255,.92);color:#101116}

/* ---------- Estados / transição ---------- */
#login{opacity:1}
#app.s-add #login{opacity:0;transform:scale(.96);filter:blur(8px);pointer-events:none;transition-delay:0s}
#app.s-add #add{opacity:1;transform:none;filter:none;pointer-events:auto;transition-delay:.2s}
#app.s-add #add .stag{opacity:1;transform:none;transition-delay:calc(.3s + var(--i) * .08s)}
#app.s-add #login .add{pointer-events:none}

/* ---------- Tela inicial (aba Games) ---------- */
.home-bg{position:absolute;inset:0;opacity:0;transition:opacity .9s ease .25s;pointer-events:none;background:
  radial-gradient(ellipse 55% 75% at 66% 42%,rgba(52,74,120,.5),transparent 70%),
  radial-gradient(ellipse 60% 60% at 10% 100%,rgba(30,44,78,.55),transparent 70%),
  linear-gradient(180deg,#0b1222 0%,#0a0f1d 100%)}
#bokeh,.vignette{transition:opacity .8s ease}
#app.s-home .home-bg{opacity:1}
#app.s-home .beam,#app.s-home #bokeh,#app.s-home .vignette{opacity:0}

#home{opacity:0;pointer-events:none;transition:opacity .35s ease;transition-delay:0s}
#app.s-home #home{opacity:1;pointer-events:auto}
.h-in{opacity:0;transform:translateY(26px) scale(.94);transition:opacity .5s ease,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:0s}
.h-top{transform:translateY(-16px)}
#app.s-home .h-in{opacity:1;transform:none;transition-delay:calc(.6s + var(--i) * .07s)}

.tab{position:absolute;top:27px;font-size:26px;line-height:30px;font-weight:400;color:rgba(255,255,255,.62);cursor:default}
.tab.on{color:#fff;font-weight:700}
.ico{position:absolute;display:grid;place-items:center;cursor:default}
.mini-av{position:absolute;left:1064px;top:25px;width:34px;height:34px;border-radius:50%;overflow:hidden;background:#0b0c11;border:1.5px solid rgba(255,255,255,.85)}

.tile{position:absolute;border-radius:9px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.06));box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.tile.mc,.tile.mc.sel,.tile.mc.kf{background:linear-gradient(160deg,#f59e0b,#9a3412)}
.tile.sel{border-radius:13px;background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.09));box-shadow:0 8px 28px rgba(0,0,0,.35)}
.tile.lib{border-radius:9px;background:rgba(70,78,96,.55);display:grid;place-items:center;box-shadow:none}

.btn-play{position:absolute;left:115px;top:558px;width:223px;height:46px;border-radius:23px;background:rgba(170,176,192,.38);font-size:21px;font-weight:500;color:#fff;display:grid;place-items:center;cursor:default}
.btn-more{position:absolute;left:353px;top:558px;width:46px;height:46px;border-radius:50%;background:rgba(170,176,192,.38);display:grid;place-items:center;cursor:default}

/* animação de entrada: login se desfaz, avatar voa para o canto */
#app.s-home #login{visibility:hidden;transition:visibility 0s linear 1.5s}
#login .title,#login .subtitle,#login .ctrl,#login .add,#login .uname,#login .opts,#login .power,#login .hints{transition:opacity .45s ease,transform .7s cubic-bezier(.4,0,.2,1)}
#app.s-home #login .title,#app.s-home #login .subtitle{opacity:0;transform:translateY(-22px)}
#app.s-home #login .ctrl,#app.s-home #login .uname,#app.s-home #login .opts{opacity:0;transform:translateY(10px)}
#app.s-home #login .ctrl{transform:translate(-50%,-10px)}
#app.s-home #login .add{opacity:0;transform:translateX(-46px) scale(.9)}
#app.s-home #login .power,#app.s-home #login .hints{opacity:0}
#app.s-home #login .avatar{transform:translate(440px,-329px) scale(.165);transition:transform 1s cubic-bezier(.65,0,.2,1) .1s,opacity .3s ease .8s;opacity:0}
#app.s-home #login .ring{box-shadow:0 0 40px rgba(255,255,255,.4)}
#app.s-home #login{pointer-events:none}

/* ---------- Tiles com layout dinâmico ---------- */
.tile{transition:opacity .5s ease,transform .7s cubic-bezier(.2,.8,.2,1),left .38s cubic-bezier(.3,.7,.2,1),top .38s cubic-bezier(.3,.7,.2,1),width .38s cubic-bezier(.3,.7,.2,1),height .38s cubic-bezier(.3,.7,.2,1),box-shadow .18s ease,background .3s ease}
#app.s-home .tile.h-in{transition-delay:calc(.6s + var(--i) * .07s),calc(.6s + var(--i) * .07s),0s,0s,0s,0s,0s,0s}

/* ---------- Foco (seleção pelo controle) ---------- */
.ring{transition:opacity .2s}
.add-circle{transition:background .2s,box-shadow .2s}
.add.kf .add-circle{background:radial-gradient(circle at 50% 22%,rgba(255,255,255,.4),rgba(255,255,255,.24) 70%);box-shadow:0 0 0 3px #fff}
.user:not(.kf) .ring{opacity:.4}
.pill{transition:background .2s,color .2s}
.pill.kf{background:rgba(255,255,255,.92);color:#101116}
.tile.kf{box-shadow:0 0 0 3px rgba(255,255,255,.95),0 8px 28px rgba(0,0,0,.35)}
.tab.kf::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:3px;border-radius:2px;background:#fff}
.ico.kf,.mini-av.kf{box-shadow:0 0 0 3px #fff;border-radius:50%}
.btn-play,.btn-more{transition:background .2s,color .2s}
.btn-play.kf{background:#fff;color:#12151f}
.btn-more.kf{background:#fff}
.btn-more.kf svg{fill:#12151f}

/* ---------- Tela Library ---------- */
#lib{opacity:0;transform:scale(1.05);filter:blur(10px);pointer-events:none;transition-delay:0s}
#app.s-lib #home{opacity:0;pointer-events:none}
#app.s-lib #store{pointer-events:none}
#app.s-lib #lib{opacity:1;transform:none;filter:none;pointer-events:auto;transition-delay:.2s}
#app.s-lib #lib .stag{opacity:1;transform:none;transition-delay:calc(.3s + var(--i) * .08s)}

/* ---------- Loja ---------- */
#store{opacity:0;transform:scale(1.05);filter:blur(10px);pointer-events:none;transition-delay:0s}
#app.s-store #home{opacity:0;pointer-events:none}
#app.s-store #store{opacity:1;transform:none;filter:none;pointer-events:auto;transition-delay:.2s}
#app.s-store #store .stag{opacity:1;transform:none;transition-delay:calc(.3s + var(--i) * .08s)}
.gcard{position:absolute;top:170px;width:220px;height:330px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:box-shadow .18s,transform .18s}
.gcard.kf{box-shadow:0 0 0 3px #fff,0 10px 30px rgba(0,0,0,.4);transform:scale(1.04)}
.gart{height:215px;display:grid;place-items:center;font-size:26px;font-weight:700;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.gname{padding:12px 14px 0;font-size:19px}
.gbtn{position:absolute;left:14px;right:14px;bottom:14px;height:40px;border-radius:20px;background:rgba(170,176,192,.38);display:grid;place-items:center;font-size:17px;font-weight:500}
.gcard.kf .gbtn{background:#fff;color:#12151f}
.gempty{position:absolute;left:0;right:0;top:300px;text-align:center;font-size:20px;color:rgba(255,255,255,.65)}
.gnote{position:absolute;left:62px;bottom:30px;font-size:14px;color:rgba(255,255,255,.5)}

/* ---------- Controle virtual (overlay) ---------- */
#pad{position:absolute;inset:0;pointer-events:none;z-index:20}
.pc{position:absolute;display:block;pointer-events:auto;touch-action:none;opacity:.5;transition:opacity .08s,transform .08s;-webkit-user-select:none;user-select:none}
.pc svg{width:100%;height:100%;overflow:visible}
.pc.pressed{opacity:.97;transform:scale(.92)}
.pc.pressed svg{filter:brightness(1.35) drop-shadow(0 0 6px rgba(255,255,255,.55))}
.grp{position:absolute;width:calc(112*var(--u));height:calc(112*var(--u));top:70%;margin-top:calc(-56*var(--u));pointer-events:none}
#dpad{left:calc(14*var(--u))}
#face{right:calc(14*var(--u))}
.dp-u{left:calc(37*var(--u));top:0;width:calc(38*var(--u));height:calc(46*var(--u))}
.dp-d{left:calc(37*var(--u));top:calc(66*var(--u));width:calc(38*var(--u));height:calc(46*var(--u))}
.dp-l{left:0;top:calc(37*var(--u));width:calc(46*var(--u));height:calc(38*var(--u))}
.dp-r{left:calc(66*var(--u));top:calc(37*var(--u));width:calc(46*var(--u));height:calc(38*var(--u))}
.dp-l svg,.dp-r svg{width:calc(38*var(--u));height:calc(46*var(--u));position:absolute;left:50%;top:50%;margin:calc(-23*var(--u)) 0 0 calc(-19*var(--u))}
.dp-l svg{transform:rotate(-90deg)}.dp-r svg{transform:rotate(90deg)}.dp-d svg{transform:rotate(180deg)}
.fb{width:calc(40*var(--u));height:calc(40*var(--u))}
.fb-t{left:calc(36*var(--u));top:0}.fb-s{left:0;top:calc(36*var(--u))}.fb-o{left:calc(72*var(--u));top:calc(36*var(--u))}.fb-x{left:calc(36*var(--u));top:calc(72*var(--u))}
.sh{top:40%;width:calc(60*var(--u));height:calc(34*var(--u))}
#l1{left:calc(40*var(--u))}#r1{right:calc(40*var(--u))}
.mid{top:80%;margin-top:calc(-22*var(--u));height:calc(44*var(--u))}
#ps{left:50%;margin-left:calc(-22*var(--u));width:calc(44*var(--u))}
#create{left:50%;margin-left:calc(-92*var(--u));width:calc(28*var(--u))}
#options{left:50%;margin-left:calc(64*var(--u));width:calc(28*var(--u))}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f2a900"/></linearGradient>
    <linearGradient id="avbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3350"/><stop offset="1" stop-color="#10131f"/></linearGradient>
  </defs>
</svg>

<div id="app">
  <div class="bg"></div>
  <div class="home-bg"></div>
  <div class="beam"><div class="blurwrap"><i class="cone"></i></div><i class="hot" style="position:absolute;inset:0"></i></div>
  <canvas id="bokeh"></canvas>
  <div class="vignette"></div>
  <div class="dim"></div>

  <div id="stage">
    <div id="clock">4:33 PM</div>

    <!-- ===== TELA PRINCIPAL ===== -->
    <section id="login" class="layer">
      <h1 class="title">Welcome Back to PlayStation</h1>
      <p class="subtitle">Who's using this controller?</p>

      <div class="ctrl">
        <span>1</span>
        <svg width="32" height="22" viewBox="0 0 32 22" fill="currentColor">
          <path d="M9 2h14c3 0 4.6 1.5 5.6 5l2 8c.5 2-1 4.2-3.1 4.2-1.5 0-2.6-.8-3.6-2.1L22.6 14H9.4l-1.3 3.1c-1 1.3-2.100 2.100-3.600 2.100C2.400 19.200.9 17 1.400 15l2-8C4.400 3.500 6 2 9 2z"/>
          <g fill="#1c1d24"><rect x="8.5" y="6.5" width="2" height="6" rx=".8"/><rect x="6.500" y="8.500" width="6" height="2" rx=".8"/><circle cx="22.500" cy="7.500" r="1.400"/><circle cx="25.200" cy="10.200" r="1.400"/></g>
        </svg>
      </div>

      <button id="addUser" class="add" type="button" aria-label="Add User">
        <span class="add-circle">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M21 5v32M5 21h32"/></svg>
        </span>
        <span class="add-label">Add User</span>
      </button>

      <button id="userPS5" class="user" type="button" aria-label="PS5">
        <div class="avatar">
          <div class="ring"></div>
          <div class="disc">
            <svg viewBox="0 0 100 100" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
              <rect width="100" height="100" fill="url(#avbg)"/>
              <circle cx="50" cy="40" r="15" fill="#9aa3bd"/>
              <path d="M18 100c0-20 14-32 32-32s32 12 32 32z" fill="#9aa3bd"/>
            </svg>
          </div>
        </div>
        <div class="uname"><span>PS5</span>
          <svg width="22" height="22" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="20" rx="2" fill="url(#gold)"/><rect x="2" y="9" width="20" height="6" rx="2" fill="url(#gold)"/></svg>
        </div>
        <div class="opts">
          <svg width="20" height="16" viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" rx="3.500" fill="#fff"/><path d="M5 5.200h10M5 8h10M5 10.800h10" stroke="#22232b" stroke-width="1.600" stroke-linecap="round"/></svg>
          <span>Options</span>
        </div>
      </button>

      <div class="power">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.800 6.500a8 8 0 1 0 10.400 0"/></svg>
      </div>

      <div class="hints">
        <div class="hint static">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.700" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M8.200 8.200l7.600 7.600M15.800 8.200l-7.600 7.600"/></svg>
          <span>Select</span>
        </div>
      </div>
    </section>

    <!-- ===== TELA ADD USER (destino da animação) ===== -->
    <section id="add" class="layer" aria-hidden="true">
      <h1 class="title stag" style="--i:0">Add User</h1>
      <button class="pill stag" type="button" style="--i:1;top:270px">Get Started</button>
      <button class="pill stag" type="button" style="--i:2;top:358px">Play as a Guest</button>

      <div class="hints stag" style="--i:3">
        <button id="backBtn" class="hint" type="button" aria-label="Back">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.700"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.500"/></svg>
          <span>Back</span>
        </button>
        <div class="hint static">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.700" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M8.200 8.200l7.600 7.600M15.800 8.200l-7.600 7.600"/></svg>
          <span>Select</span>
        </div>
      </div>
    </section>

    <!-- ===== ABA GAMES (estrutura apenas, sem jogos) ===== -->
    <section id="home" class="layer" inert aria-hidden="true">
      <div id="tGames" class="tab on h-in h-top" style="--i:0;left:62px">Games</div>
      <div id="tMedia" class="tab h-in h-top" style="--i:1;left:194px">Media</div>

      <div id="tSearch" class="ico h-in h-top" style="--i:2;left:926px;top:26px;width:32px;height:32px">

<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var stage = document.getElementById('stage');
  var login = document.getElementById('login');
  var addScreen = document.getElementById('add');
  var addBtn = document.getElementById('addUser');
  var userBtn = document.getElementById('userPS5');
  var home = document.getElementById('home');
  var backBtn = document.getElementById('backBtn');
  var clockEl = document.getElementById('clock');
  var cv = document.getElementById('bokeh');
  var cx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var cw = 0, ch = 0;
  var state = 'login', busy = false;

  /* ---------- Layout: paisagem sempre, ajustado à tela ---------- */
  function layout() {
    var iw = window.innerWidth, ih = window.innerHeight;
    var portrait = ih > iw;
    var W = portrait ? ih : iw, H = portrait ? iw : ih;
    app.style.width = W + 'px';
    app.style.height = H + 'px';
    app.style.transform = portrait ? 'translate(' + iw + 'px,0) rotate(90deg)' : 'none';
    var s = Math.min(W / 1280, H / 720);
    stage.style.transform = 'translate(' + ((W - 1280 * s) / 2) + 'px,' + ((H - 720 * s) / 2) + 'px) scale(' + s + ')';
    cw = W; ch = H;
    app.style.setProperty('--u', Math.min(Math.max(H / 390, 0.8), 1.8) + 'px');
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 120); });

  /* ---------- Relógio ---------- */
  var clockFmt = null, lastClock = '';
  try {
    clockFmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Sao_Paulo', hour: 'numeric', minute: '2-digit', hour12: true });
  } catch (e) {}
  function tick() {
    var d = new Date(), txt;
    try {
      txt = clockFmt ? clockFmt.format(d) : new Date(d.getTime() + (d.getTimezoneOffset() - 180) * 60000)
        .toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    } catch (e) { return; }
    txt = txt.replace(/\u202f|\u00a0/g, ' ');
    if (txt !== lastClock) { clockEl.textContent = txt; lastClock = txt; }
  }
  tick(); setInterval(tick, 1000);

  /* ---------- Partículas douradas (bokeh) ---------- */
  function weight(x, y) {
    var w = 0.05;
    if (x > 0.68 && y > 0.36 && y < 0.84) w += Math.exp(-Math.pow((y - 0.6) / 0.19, 2)) * Math.min(1, (x - 0.68) / 0.16);
    if (x < 0.42 && y > 0.6) w += 0.55 * Math.exp(-Math.pow((x - 0.15) / 0.22, 2)) * Math.min(1, (y - 0.6) / 0.15);
    if (x > 0.45 && x < 0.75 && y > 0.52 && y < 0.8) w += 0.18;
    return w;
  }
  var parts = [];
  (function seed() {
    while (parts.length < 190) {
      var x = Math.random(), y = Math.random();
      if (Math.random() > weight(x, y)) continue;
      var big = Math.random() < 0.12;
      parts.push({
        x: x, y: y,
        r: big ? 5 + Math.random() * 9 : 0.7 + Math.random() * 1.6,
        a: big ? 0.1 + Math.random() * 0.16 : 0.35 + Math.random() * 0.5,
        big: big,
        g: 165 + Math.random() * 55 | 0,
        b: 80 + Math.random() * 60 | 0,
        ax: 0.003 + Math.random() * 0.008, ay: 0.004 + Math.random() * 0.01,
        fx: 0.15 + Math.random() * 0.4, fy: 0.15 + Math.random() * 0.4,
        ft: 0.4 + Math.random() * 1.2, ph: Math.random() * 6.28
      });
    }
  })();

  function frame(t) {
    var s = t / 1000, k = ch / 720 * 1.25, i, p, px, py, tw, al, r, g;
    cx.clearRect(0, 0, cw, ch);
    cx.globalCompositeOperation = 'lighter';
    for (i = 0; i < parts.length; i++) {
      p = parts[i];
      px = (p.x + Math.sin(s * p.fx + p.ph) * p.ax) * cw;
      py = (p.y + Math.cos(s * p.fy + p.ph * 1.3) * p.ay) * ch;
      tw = 0.65 + 0.35 * Math.sin(s * p.ft + p.ph * 2);
      al = p.a * tw;
      r = p.r * k;
      if (p.big) {
        g = cx.createRadialGradient(px, py, 0, px, py, r);
        g.addColorStop(0, 'rgba(255,' + p.g + ',' + p.b + ',' + (al * 0.55) + ')');
        g.addColorStop(0.75, 'rgba(255,' + p.g + ',' + p.b + ',' + al + ')');
        g.addColorStop(1, 'rgba(255,' + p.g + ',' + p.b + ',0)');
        cx.fillStyle = g;
      } else {
        cx.fillStyle = 'rgba(255,' + p.g + ',' + p.b + ',' + al + ')';
      }
      cx.beginPath();
      cx.arc(px, py, r, 0, 6.2832);
      cx.fill();
    }
    requestAnimationFrame(frame);
  }

  /* ---------- Catálogo + ponte nativa ---------- */
  // source 'pick': escolhe o APK no celular ao tocar em Instalar. // asset: nome(s) do(s) APK(s) em assets/, separados por vírgula (ex.: 'base.apk,config.arm64_v8a.apk'). source: 'play' abre a página oficial; 'apk' instala um APK embutido em assets/ (só para jogos que você tem direito de distribuir)
  var CATALOG = [
    { id: 'dantheman', name: 'Dan the Man', pkg: 'com.halfbrick.dantheman', source: 'apk', asset: 'DanTheMan.apk', c1: '#f59e0b', c2: '#9a3412' }
  ];
  var N = window.PS5Native || null;          // injetado pelo Kotlin (addJavascriptInterface)
  var installed = {}, busyPkg = {}, storeIdx = 0, libIdx = 0, mockSet = {};
  try { mockSet = JSON.parse(localStorage.getItem('ps5mock') || '{}'); } catch (e) {}
  function refreshInstalled() {
    var list = [];
    try { list = N ? JSON.parse(N.installedPackages(JSON.stringify(CATALOG.map(function (g) { return g.pkg; })))) : []; } catch (e) {}
    installed = {}; list.forEach(function (p) { installed[p] = 1; busyPkg[p] = 0; });
    drawStore(); drawLib();
  }

  // mostra mensagens na tela (o alert() do WebView não aparece sem WebChromeClient)
  function ps5msg(t) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:50%;top:18%;transform:translateX(-50%);max-width:80%;background:rgba(0,0,0,.92);color:#fff;font:22px/1.35 sans-serif;padding:18px 26px;border-radius:14px;text-align:center;z-index:99999;box-shadow:0 8px 30px rgba(0,0,0,.6)';
    d.textContent = t;
    d.onclick = function () { d.remove(); };
    document.body.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.remove(); }, 12000);
  }
  function install(g) {
    if (installed[g.pkg] || busyPkg[g.pkg]) return;
    busyPkg[g.pkg] = 1; drawStore();
    if (N) { N.install(g.pkg, g.source, g.asset); return; }
    busyPkg[g.pkg] = 0; drawStore(); ps5msg('A instalação real só funciona dentro do app Android com a parte nativa (Kotlin). Este HTML sozinho não consegue instalar nada.');
  }
  function openGame(g) { if (installed[g.pkg]) launch(g); else openStore(); }
  function launch(g) { if (N) N.launch(g.pkg); else ps5msg('Sem ponte nativa: só abre dentro do app Android.'); }
  // chamados pelo Kotlin
  window.ps5 = {
    refresh: refreshInstalled,
    status: function (pkg, st, msg) { if (st !== 'installing') busyPkg[pkg] = 0; if (st === 'failed' && msg) ps5msg(msg); refreshInstalled(); }
  };
  function cardHTML(g, i, label) {
    return '<div class="gcard stag" data-i="' + i + '" style="--i:' + (i + 2) + ';left:' + (62 + i * 250) + 'px"><div class="gart" style="background:linear-gradient(160deg,' + g.c1 + ',' + g.c2 + ')">' + g.name.toUpperCase() + '</div><div class="gname">' + g.name + '</div><div class="gbtn">' + label + '</div></div>';
  }
  function drawStore() {
    document.getElementById('storeGrid').innerHTML = CATALOG.map(function (g, i) {
      return cardHTML(g, i, installed[g.pkg] ? 'Installed' : busyPkg[g.pkg] ? 'Installing…' : 'Install');
    }).join('');
    document.getElementById('storeNote').textContent = N ? '' : 'Sem ponte nativa: instalação indisponível (use o app Android)';
    markFocus();
  }
  function drawLib() {
    var games = CATALOG.filter(function (g) { return installed[g.pkg]; });
    document.getElementById('libGrid').innerHTML = games.length
      ? games.map(function (g, i) { return cardHTML(g, i, 'Play'); }).join('')
      : '<div class="gempty stag" style="--i:2">No games installed. Get one from the Store.</div>';
    markFocus();
  }
  function libGames() { return CATALOG.filter(function (g) { return installed[g.pkg]; }); }
  function markFocus() {
    Array.prototype.forEach.call(document.querySelectorAll('#storeGrid .gcard'), function (e, i) { e.classList.toggle('kf', i === storeIdx); });
    Array.prototype.forEach.call(document.querySelectorAll('#libGrid .gcard'), function (e, i) { e.classList.toggle('kf', i === libIdx); });
  }

  /* ---------- Navegação por foco (controle) ---------- */
  var libScreen = document.getElementById('lib');
  var libBack = document.getElementById('libBack');
  var pills = Array.prototype.slice.call(addScreen.querySelectorAll('.pill'));
  var topEls = ['tGames', 'tMedia', 'tSearch', 'tGear', 'tAvatar'].map(function (id) { return document.getElementById(id); });
  var bPlay = document.getElementById('bPlay'), bMore = document.getElementById('bMore');
  var tileEls = Array.prototype.slice.call(home.querySelectorAll('.tile'));
  var nav = { login: 1, add: 0, row: 'tiles', top: 0, tile: 1, play: 0 };

  function place(i, l, d) {
    var e = tileEls[i];
    e.style.left = l + 'px'; e.style.top = d.t + 'px';
    e.style.width = d.w + 'px'; e.style.height = d.h + 'px';
    e.classList.toggle('sel', i === nav.tile);
  }
  function dims(i, sel) {
    var lib = i === tileEls.length - 1;
    if (sel) return lib ? { w: 84, h: 84, t: 82 } : { w: 115, h: 115, t: 82 };
    return lib ? { w: 58, h: 58, t: 83 } : { w: 70, h: 68, t: 85 };
  }
  function layoutTiles() {
    var n = tileEls.length, s = nav.tile, i, d = dims(s, true), x;
    place(s, 113, d);
    x = 113 + d.w + 10;
    for (i = s + 1; i < n; i++) { d = dims(i, false); place(i, x, d); x += d.w + (i + 1 === n - 1 ? 22 : 6); }
    x = 113 - 8;
    for (i = s - 1; i >= 0; i--) { d = dims(i, false); place(i, x - d.w, d); x -= d.w + 7; }
  }
  function render() {
    addBtn.classList.toggle('kf', nav.login === 0);
    userBtn.classList.toggle('kf', nav.login === 1);
    pills.forEach(function (p, i) { p.classList.toggle('kf', nav.add === i); });
    topEls.forEach(function (e, i) { e.classList.toggle('kf', nav.row === 'top' && nav.top === i); });
    tileEls.forEach(function (e, i) { e.classList.toggle('kf', nav.row === 'tiles' && nav.tile === i); });
    bPlay.classList.toggle('kf', nav.row === 'play' && nav.play === 0);
    bMore.classList.toggle('kf', nav.row === 'play' && nav.play === 1);
    layoutTiles();
  }

  function move(dir) {
    if (busy) return;
    var n = tileEls.length;
    if (state === 'login') {
      if (dir === 'left') nav.login = 0; else if (dir === 'right') nav.login = 1;
    } else if (state === 'add') {
      if (dir === 'up') nav.add = 0; else if (dir === 'down') nav.add = 1;
    } else if (state === 'store') {
      if (dir === 'left') storeIdx = Math.max(0, storeIdx - 1); else if (dir === 'right') storeIdx = Math.min(CATALOG.length - 1, storeIdx + 1);
      markFocus();
    } else if (state === 'lib') {
      if (dir === 'left') libIdx = Math.max(0, libIdx - 1); else if (dir === 'right') libIdx = Math.max(0, Math.min(libGames().length - 1, libIdx + 1));
      markFocus();
    } else if (state === 'home') {
      if (nav.row === 'tiles') {
        if (dir === 'left') nav.tile = Math.max(0, nav.tile - 1);
        else if (dir === 'right') nav.tile = Math.min(n - 1, nav.tile + 1);
        else if (dir === 'up') nav.row = 'top';
        else if (dir === 'down') { nav.row = 'play'; nav.play = 0; }
      } else if (nav.row === 'top') {
        if (dir === 'left') nav.top = Math.max(0, nav.top - 1);
        else if (dir === 'right') nav.top = Math.min(topEls.length - 1, nav.top + 1);
        else if (dir === 'down') nav.row = 'tiles';
      } else {
        if (dir === 'left') nav.play = 0;
        else if (dir === 'right') nav.play = 1;
        else if (dir === 'up') nav.row = 'tiles';
      }
    }
    render();
  }
  function confirmKey() {
    if (busy) return;
    if (state === 'login') { if (nav.login === 0) openAdd(); else openHome(); }
    else if (state === 'home' && nav.row === 'tiles' && nav.tile === tileEls.length - 1) openLib();
    else if (state === 'home' && nav.row === 'tiles' && nav.tile === 0) openStore();
    else if (state === 'home' && nav.row === 'tiles' && nav.tile === 1) openGame(CATALOG[0]);
    else if (state === 'home' && nav.row === 'play' && nav.play === 0 && nav.tile === 1) openGame(CATALOG[0]);
    else if (state === 'store') install(CATALOG[storeIdx]);
    else if (state === 'lib') { var g = libGames()[libIdx]; if (g) launch(g); }
  }
  function backKey() {
    if (busy) return;
    if (state === 'add') closeAdd();
    else if (state === 'lib') closeLib();
    else if (state === 'store') closeStore();
    else if (state === 'home') closeHome();
  }

  /* ---------- Add User ---------- */
  function openAdd() {
    if (busy || state !== 'login') return;
    busy = true;
    nav.login = 0; nav.add = 0; render();
    addBtn.classList.add('pressing');
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
    setTimeout(function () {
      app.classList.add('s-add');
      login.setAttribute('inert', '');
      addScreen.removeAttribute('inert');
      addScreen.setAttribute('aria-hidden', 'false');
    }, 140);
    setTimeout(function () {
      state = 'add';
      busy = false;
      addBtn.classList.remove('pressing');
    }, 950);
  }
  function closeAdd() {
    if (busy || state !== 'add') return;
    busy = true;
    app.classList.remove('s-add');
    addScreen.setAttribute('inert', '');
    addScreen.setAttribute('aria-hidden', 'true');
    login.removeAttribute('inert');
    setTimeout(function () { state = 'login'; busy = false; }, 800);
  }

  /* ---------- Usuário PS5 -> aba Games ---------- */
  function openHome() {
    if (busy || state !== 'login') return;
    busy = true;
    nav.login = 1; nav.row = 'tiles'; nav.tile = 1; nav.top = 0; nav.play = 0; render();
    userBtn.classList.add('pressing');
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
    setTimeout(function () {
      userBtn.classList.remove('pressing');
      login.setAttribute('inert', '');
      home.removeAttribute('inert');
      home.setAttribute('aria-hidden', 'false');
      app.classList.add('s-home');
    }, 160);
    setTimeout(function () { state = 'home'; busy = false; }, 1900);
  }
  function closeHome() {
    if (busy || state !== 'home') return;
    busy = true;
    app.classList.remove('s-home');
    home.setAttribute('inert', '');
    home.setAttribute('aria-hidden', 'true');
    login.removeAttribute('inert');
    setTimeout(function () { state = 'login'; busy = false; }, 1200);
  }

  /* ---------- Library ---------- */
  function openLib() {
    if (busy || state !== 'home') return;
    busy = true;
    home.setAttribute('inert', '');
    libScreen.removeAttribute('inert');
    libScreen.setAttribute('aria-hidden', 'false');
    refreshInstalled(); libIdx = 0; markFocus();
    app.classList.add('s-lib');
    setTimeout(function () { state = 'lib'; busy = false; }, 750);
  }
  function closeLib() {
    if (busy || state !== 'lib') return;
    busy = true;
    app.classList.remove('s-lib');
    libScreen.setAttribute('inert', '');
    libScreen.setAttribute('aria-hidden', 'true');
    home.removeAttribute('inert');
    setTimeout(function () { state = 'home'; busy = false; }, 650);
  }

  /* ---------- Store ---------- */
  var storeScreen = document.getElementById('store');
  function openStore() {
    if (busy || state !== 'home') return;
    busy = true; refreshInstalled();
    home.setAttribute('inert', ''); storeScreen.removeAttribute('inert'); storeScreen.setAttribute('aria-hidden', 'false');
    app.classList.add('s-store');
    setTimeout(function () { state = 'store'; busy = false; }, 750);
  }
  function closeStore() {
    if (busy || state !== 'store') return;
    busy = true; app.classList.remove('s-store');
    storeScreen.setAttribute('inert', ''); storeScreen.setAttribute('aria-hidden', 'true'); home.removeAttribute('inert');
    setTimeout(function () { state = 'home'; busy = false; }, 650);
  }
  document.getElementById('storeBack').addEventListener('click', closeStore);
  document.getElementById('storeGrid').addEventListener('click', function (e) {
    var c = e.target.closest('.gcard'); if (!c || state !== 'store') return;
    storeIdx = +c.getAttribute('data-i'); markFocus(); install(CATALOG[storeIdx]);
  });
  document.getElementById('libGrid').addEventListener('click', function (e) {
    var c = e.target.closest('.gcard'); if (!c || state !== 'lib') return;
    libIdx = +c.getAttribute('data-i'); markFocus(); launch(libGames()[libIdx]);
  });

  /* ---------- Toque direto na tela ---------- */
  userBtn.addEventListener('click', openHome);
  addBtn.addEventListener('click', openAdd);
  backBtn.addEventListener('click', closeAdd);
  libBack.addEventListener('click', closeLib);
  tileEls.forEach(function (e, i) {
    e.addEventListener('click', function () {
      if (busy || state !== 'home') return;
      nav.row = 'tiles'; nav.tile = i; render();
      if (i === tileEls.length - 1) openLib();
      else if (i === 0) openStore();
      else if (i === 1) openGame(CATALOG[0]);
    });
  });
  topEls.forEach(function (e, i) {
    e.addEventListener('click', function () { if (state === 'home' && !busy) { nav.row = 'top'; nav.top = i; render(); } });
  });
  bPlay.addEventListener('click', function () { if (state === 'home' && !busy) { nav.row = 'play'; nav.play = 0; render(); if (nav.tile === 1) openGame(CATALOG[0]); } });
  bMore.addEventListener('click', function () { if (state === 'home' && !busy) { nav.row = 'play'; nav.play = 1; render(); } });

  /* ---------- Controle virtual ---------- */
  var HOLD = { up: 1, down: 1, left: 1, right: 1 };
  function act(k) {
    if (HOLD[k]) move(k);
    else if (k === 'x') confirmKey();
    else if (k === 'o') backKey();
  }
  var padEls = Array.prototype.slice.call(document.querySelectorAll('#pad [data-k]'));
  padEls.forEach(function (el) {
    var k = el.getAttribute('data-k'), t1 = 0, t2 = 0;
    function stop() { clearTimeout(t1); clearInterval(t2); el.classList.remove('pressed'); }
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      el.classList.add('pressed');
      try { if (navigator.vibrate) navigator.vibrate(8); } catch (err) {}
      act(k);
      if (HOLD[k]) { clearTimeout(t1); clearInterval(t2); t1 = setTimeout(function () { t2 = setInterval(function () { act(k); }, 130); }, 380); }
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) { el.addEventListener(ev, stop); });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  /* ---------- Teclado (equivale ao controle) ---------- */
  var KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'x', ' ': 'x', Escape: 'o', Backspace: 'o' };
  document.addEventListener('keydown', function (e) {
    var k = KEYS[e.key];
    if (!k) return;
    e.preventDefault();
    if (e.repeat && !HOLD[k]) return;
    var el = document.querySelector('#pad [data-k="' + k + '"]');
    if (el) { el.classList.add('pressed'); setTimeout(function () { el.classList.remove('pressed'); }, 120); }
    act(k);
  });
  document.addEventListener('keyup', function (e) { if (KEYS[e.key]) e.preventDefault(); });

  addScreen.setAttribute('inert', '');
  home.setAttribute('inert', '');
  libScreen.setAttribute('inert', '');
  storeScreen.setAttribute('inert', '');
  refreshInstalled();
  render();
  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
